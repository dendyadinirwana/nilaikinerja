<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }
    #bot-container {
      position: relative;
    }
  </style>
</head>
<body>
  <div id="bot-container"></div>
  <script src="robot-heads.js"></script>
  <script>
    let bot = null;

    function parseParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        size: parseInt(params.get('size') || '120', 10),
        shape: params.get('shape') || 'rectangle',
        state: params.get('state') || 'idle',
        color: params.get('color') || '#2563EB',
        trimColor: params.get('trimColor') || '#93A6C8',
        screenColor: params.get('screenColor') || '#E8F2FF',
        antenna: params.get('antenna') !== '0',
        floorShadow: params.get('floorShadow') !== '0',
        speed: parseFloat(params.get('speed') || '1'),
        interactive: params.get('interactive') !== '0'
      };
    }

    function initBot(cfg) {
      const container = document.getElementById('bot-container');
      container.innerHTML = '';
      const options = Object.assign(parseParams(), cfg || {});
      try {
        bot = window.RobotHead.create(container, options);
      } catch (err) {
        console.error('Failed to create RobotHead:', err);
      }
    }

    window.robotBridge = {
      init: initBot,
      setState: function(state) {
        if (bot) bot.setState(state);
      },
      setShape: function(shape) {
        if (bot) bot.setShape(shape);
      },
      poke: function() {
        if (bot) bot.poke();
      },
      setLook: function(x, y) {
        if (bot) bot.setLook(x, y);
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => initBot());
    } else {
      initBot();
    }
  </script>
</body>
</html>
