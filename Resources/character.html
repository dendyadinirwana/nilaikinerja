<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Nilai Kinerja Character</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    /* WKWebView composites its content over an opaque white backdrop unless
       the page paints one. Painting the capsule colour here is what keeps the
       character's surround black instead of a white box; the web view itself
       is moused-through, so nothing is clickable in this region anyway. */
    background: transparent;
    overflow: hidden;
    /* The engine draws SVG; nothing here should ever be selected or
       show a text cursor, since the page sits inside a notch capsule. */
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  #mate {
    width: 100%;
    height: 100%;
    background: transparent;
    /* Mood Mates is designed around a 240x240 viewBox and scales from
       there; centring keeps the character optically aligned in the
       capsule regardless of the panel height. */
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #mate svg { display: block; overflow: visible; }
</style>
</head>
<body>
  <div id="mate"></div>

  <!-- Engine load order is fixed by the upstream integration guide:
       geometry -> render -> features -> fx -> emotion data -> driver,
       then the character definitions. -->
  <script src="mood-mates/src/core/geometry.js"></script>
  <script src="mood-mates/src/core/render.js"></script>
  <script src="mood-mates/src/core/features.js"></script>
  <script src="mood-mates/src/core/fx.js"></script>
  <script src="mood-mates/src/data/emotions.js"></script>
  <script src="mood-mates/src/core/engine.js"></script>
  <script src="mood-mates/src/characters/nimbo.js"></script>
  <script src="mood-mates/src/characters/twinkle.js"></script>

  <script>
  (function () {
    'use strict';

    var CHARACTER = 'nimbo';
    // 02 = idle, per the emotionId contract (00-09 lifecycle).
    var EMOTION = '02';

    var mate = null;

    function boot() {
      if (typeof window.MoodMates === 'undefined' || !window.MoodMates.create) {
        // Scripts failed to load; leave the capsule empty rather than
        // rendering a broken half-state.
        return;
      }
      try {
        mate = window.MoodMates.create(document.getElementById('mate'), {
          character: CHARACTER,
          emotion: EMOTION,
          // The notch is narrow, so the eyes are scaled up to stay legible at
          // roughly 34pt. The upstream guide recommends 1.5-1.8 below 80px.
          eyeScale: 1.55,
          lite: true,
          idle: true
        });
      } catch (err) {
        return;
      }

      // The bridge the Swift side calls into. Kept deliberately small: only
      // what the notch needs.
      window.nilaiMate = {
        setEmotion: function (id) {
          if (!mate) { EMOTION = id; return; }
          try { mate.setEmotion(id); } catch (e) {}
        },
        setActive: function (on) {
          if (!mate) return;
          try { mate.setActive(!!on); } catch (e) {}
        },
        setGaze: function (x, y) {
          if (!mate) return;
          try { mate.setGaze(x, y); } catch (e) {}
        },
        celebrate: function () {
          if (!mate) return;
          try { mate.celebrate(); } catch (e) {}
        }
      };
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
